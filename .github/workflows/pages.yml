name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html AmericanTranslator.html BritishTranslator.html videototext.html voice-to-sign.html ZimbabweanTranslator.html _site/
          cp -R css images js _site/
          mkdir -p _site/dictionary
          cp "dictionary/ZSL.pdf.pdf" "dictionary/The Joy of Signing_ A Dictionary of American Signs ( PDFDrive.com ).pdf" _site/dictionary/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
